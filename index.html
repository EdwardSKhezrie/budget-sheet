<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget Sheet">
<meta name="theme-color" content="#f6f5f1">
<title>Budget Sheet</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#16181d;--mute:#6b6f78;--line:#e6e4dd;--green:#1f7a4d;--red:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--card:#1b1d21;--ink:#eceae4;--mute:#9a9ea7;--line:#2c2f35;--green:#5cc493;--red:#ef7f78}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px}
h1{margin:0 0 4px;font-size:24px}
p{margin:0 0 20px;color:var(--mute);font-size:14px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);outline:none}
.keep{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:14px;color:var(--mute)}
button{width:100%;font:inherit;font-weight:600;font-size:16px;padding:12px;border:0;border-radius:10px;background:var(--green);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <h1>Budget Sheet</h1>
  <p>Private. Sign in to continue.</p>
  <input type="text" name="username" value="budget-sheet" autocomplete="username" hidden>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <div class="keep"><input id="keep" type="checkbox" checked><label for="keep" style="margin:0">Keep me signed in on this device</label></div>
  <button id="go" type="submit">Sign in</button>
  <div class="err" id="err"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},key,b64(D.c));
  return new TextDecoder().decode(out);
}
function show(html){html=html.replace('<head>','<head>\n<link rel="manifest" href="manifest.json">\n<link rel="icon" type="image/png" href="icon-192.png">\n<link rel="apple-touch-icon" href="icon-192.png">');document.open();document.write(html);document.close()}
const KEY='bs_session';
(async()=>{let saved=null;try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){try{show(await open_(saved));return}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}}})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value,btn=document.getElementById('go'),err=document.getElementById('err');
  btn.disabled=true;btn.textContent='Signing in…';err.textContent='';
  try{const html=await open_(pw);
    if(document.getElementById('keep').checked){try{localStorage.setItem(KEY,pw)}catch(_){}}
    show(html)}
  catch(_){err.textContent='Wrong password. Try again.';btn.disabled=false;btn.textContent='Sign in'}
});
</script>
